version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: pip
    directory: /base
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /cbox
    schedule:
      interval: weekly
    allow:
      - dependency-name: boxlite
