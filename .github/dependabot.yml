version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: cargo
    directory: /cbox
    schedule:
      interval: weekly
    allow:
      - dependency-type: all
    groups:
      cargo:
        patterns: ['*']
        # boxlite is pinned exactly and changes VM behavior, so it keeps its own PR
        exclude-patterns: [boxlite]
