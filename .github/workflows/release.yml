name: release

# Runs after ci finishes on main, so a release can only be cut from a commit
# whose tests passed, and its binaries come from that same ci run. main only
# accepts PRs (default-branch ruleset), so a push there is always a merge.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    # `branches` matches head_branch, which a fork PR can also call main, so
    # check the event too.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Everything below runs as the release app: its PRs and merges trigger
      # workflows (GITHUB_TOKEN's don't), and it can bypass the ruleset to merge.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
      # One release for the whole repo: opens/updates a release PR that bumps
      # CHANGELOG.md and cbox's Cargo.toml/Cargo.lock; merging it tags vX.Y.Z and
      # publishes the GitHub release. Later artifacts (e.g. images) hang off the same tag.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
      # Auto-merge the release PR, but only if this app opened it and it only
      # bumps versions and prepends to CHANGELOG.md. The merge is pinned to the
      # commit checked. Merging relies on the app being a ruleset bypass actor.
      - if: steps.release.outputs.prs_created == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: steps.release.outputs.prs_created == 'true'
        run: |
          read -r author sha < <(gh pr view "$BRANCH" --json author,headRefOid -q '"\(.author.login) \(.headRefOid)"')
          if [ "$author" != "app/$APP_SLUG" ]; then
            echo "::error::release PR opened by $author, not app/$APP_SLUG; not merging"
            exit 1
          fi
          git fetch --no-tags origin "$sha"
          python3 .github/scripts/check_release_pr.py origin/main "$sha"
          gh pr merge "$BRANCH" --squash --admin --match-head-commit "$sha"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BRANCH: release-please--branches--main

  # Only when a release was just published: attach the binaries the
  # triggering ci run built. The release PR's merge bumps cbox/Cargo.toml, so
  # ci's build ran for that commit and the binaries carry the new version.
  # ponytail: if two merges land before ci finishes, the release can be created
  # by the later run, whose ci may have skipped the build; the download then
  # fails and a re-run of the release PR's run fixes it.
  assets:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          pattern: cbox-*
          merge-multiple: true
          path: dist

      - run: gh release upload "$TAG" dist/cbox-linux-x86_64 dist/cbox-macos-arm64 --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}

  # Publishes cbox-base:<release tag> and moves :latest. Built from the
  # released commit (not main's tip, which may have moved on) with the cache
  # skipped, so the image carries today's upstream packages.
  base-image:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/base-image.yml
    with:
      tags: |
        ${{ needs.release-please.outputs.tag_name }}
        latest
      push: true
      no-cache: true
      ref: ${{ github.event.workflow_run.head_sha }}
