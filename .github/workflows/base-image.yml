name: base-image

# Builds base/ and base-rust/ (layered on it) as multi-arch images via
# image.yml. ci.yml calls it for PRs, release.yml after a release; the weekly
# schedule refreshes :latest between releases, because base/ installs the
# newest Claude Code/gh/apt packages at build time and nothing else would
# pick those up. See docs/design/images.md.
on:
  workflow_call:
    inputs:
      tags:
        description: Tags to publish (no repository), comma- or newline-separated, e.g. "v0.1.4,latest"
        type: string
        required: true
      push:
        type: boolean
        required: true
      no-cache:
        type: boolean
        default: false
      ref:
        description: Git ref to build; empty means the triggering commit
        type: string
        default: ''
    outputs:
      image:
        description: Full reference of the first pushed tag; empty when not pushed
        value: ${{ jobs.base.outputs.image }}
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      tags:
        description: 'Comma-separated tags, e.g. "v0.1.4,latest". Empty: today''s date + latest'
        type: string
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  # Normalizes the three triggers into one set of values. Scheduled and manual
  # runs are the weekly refresh: dated tag + latest (or the tags typed into the
  # Run workflow form), pushed, cache skipped so the fixed-text install steps
  # (npm install -g, apt upgrade) actually re-run, and always built from the
  # default branch — workflow_dispatch can be fired from any branch in the UI,
  # and that ref must never move :latest.
  # Tags are split on commas or whitespace (the UI form is single-line) and
  # checked against Docker's tag grammar here, so a typo fails in seconds
  # instead of after the image builds.
  prep:
    runs-on: ubuntu-26.04
    outputs:
      tags: ${{ steps.v.outputs.tags }}
      push: ${{ steps.v.outputs.push }}
      no-cache: ${{ steps.v.outputs.no-cache }}
      ref: ${{ steps.v.outputs.ref }}
    steps:
      - id: v
        env:
          EVENT: ${{ github.event_name }}
          IN_TAGS: ${{ inputs.tags }}
          IN_PUSH: ${{ inputs.push }}
          IN_NO_CACHE: ${{ inputs.no-cache }}
          IN_REF: ${{ inputs.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -f  # tags are data: no globbing when splitting them below
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ]; then
            raw="${IN_TAGS:-$(date -u +%F),latest}"
            push=true
            no_cache=true
            ref="$DEFAULT_BRANCH"
          else
            raw="$IN_TAGS"
            push="$IN_PUSH"
            no_cache="$IN_NO_CACHE"
            ref="$IN_REF"
          fi
          tags=""
          for t in ${raw//,/ }; do
            if ! [[ "$t" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "::error::invalid image tag '$t': use letters, digits, '_', '.', '-' (max 128), without the repository"
              exit 1
            fi
            tags="$tags$t"$'\n'
          done
          if [ -z "$tags" ]; then
            echo "::error::no image tags given"
            exit 1
          fi
          {
            echo "tags<<EOF"
            printf '%s' "$tags"
            echo "EOF"
            echo "push=$push"
            echo "no-cache=$no_cache"
            echo "ref=$ref"
          } >> "$GITHUB_OUTPUT"
          echo "tags=$(echo "$tags" | tr '\n' ' ') push=$push no-cache=$no_cache ref=${ref:-<trigger>}"

  base:
    needs: prep
    uses: ./.github/workflows/image.yml
    with:
      context: base
      image: ghcr.io/the-mentor/cbox-base
      tags: ${{ needs.prep.outputs.tags }}
      push: ${{ needs.prep.outputs.push == 'true' }}
      no-cache: ${{ needs.prep.outputs.no-cache == 'true' }}
      ref: ${{ needs.prep.outputs.ref }}

  # Layered on the base this run just pushed, so both move together; when
  # nothing was pushed (fork/Dependabot PRs) it checks against :latest.
  rust:
    needs: [prep, base]
    uses: ./.github/workflows/image.yml
    with:
      context: base-rust
      image: ghcr.io/the-mentor/cbox-base-rust
      base-image: ${{ needs.base.outputs.image || 'ghcr.io/the-mentor/cbox-base:latest' }}
      tags: ${{ needs.prep.outputs.tags }}
      push: ${{ needs.prep.outputs.push == 'true' }}
      no-cache: ${{ needs.prep.outputs.no-cache == 'true' }}
      ref: ${{ needs.prep.outputs.ref }}
