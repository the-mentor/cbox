name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Incremental artifacts are useless on a fresh runner and bloat the cache.
  CARGO_INCREMENTAL: 0
  # Pinned so every build (and so every release binary) uses one compiler and
  # the cache key tracks it. Bump by hand.
  RUST_VERSION: 1.98.1

jobs:
  # Decides whether the Rust build/test needs to run at all.
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
      base: ${{ steps.diff.outputs.base }}
      custom: ${{ steps.diff.outputs.custom }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Falls back to "true" when there's no usable base (act, a new branch).
      # CHANGELOG.md only changes in release PRs, whose merge must always build:
      # release.yml attaches this run's artifacts to the release.
      # The release PR itself (release-please's branch, in this repo, not a
      # fork) skips: release.yml auto-merges it within seconds without waiting
      # for checks, so this build would only finish after the merge. The push
      # to main that follows still builds.
      # base/custom follow the same rules and gate the image jobs.
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          RELEASE_PR: ${{ github.head_ref == 'release-please--branches--main' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          # Changed paths, listed once. match greps via here-string, not a pipe:
          # grep -q exits early and SIGPIPEs the pipe's writer on a large diff.
          changed="$(git diff --name-only "$BASE" HEAD 2>/dev/null || true)"
          match() { grep -qE "$1" <<< "$changed"; }
          if [ "$RELEASE_PR" = true ]; then
            rust=false base=false custom=false
          elif [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            rust=true base=true custom=true
          else
            match '^(cbox/|\.github/workflows/ci\.yml$|CHANGELOG\.md$)' && rust=true || rust=false
            match '^(base/|\.github/workflows/(base-image|ci)\.yml$)' && base=true || base=false
            match '^(custom/|\.github/workflows/ci\.yml$)' && custom=true || custom=false
            # A new base can break custom/, so check them together.
            [ "$base" = true ] && custom=true
          fi
          printf 'rust=%s\nbase=%s\ncustom=%s\n' "$rust" "$base" "$custom" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: cbox-linux-x86_64
          - os: macos-14
            asset: cbox-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # boxlite's build.rs compiles boxlite-shared, which requires protoc >= 3.12
      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      # Hosted runners ship rustup; act's runner image doesn't, so install it there.
      - name: Install Rust toolchain
        run: |
          if ! command -v rustup >/dev/null; then
            curl -fsSL --proto '=https' --tlsv1.2 https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      # Dependency compilation is ~3.5 min of an uncached run. Keyed on the
      # lockfile; restore-keys falls back to the last cache for this OS. PRs can
      # restore caches saved on main, so pushes to main keep them warm.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            cbox/target
          key: cargo-${{ runner.os }}-rust${{ env.RUST_VERSION }}-${{ hashFiles('cbox/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-rust${{ env.RUST_VERSION }}-

      - name: Unit Test
        working-directory: cbox
        run: cargo test --release

      - name: Build
        working-directory: cbox
        run: cargo build --release

      - run: cp cbox/target/release/cbox ${{ matrix.asset }}

      # act's artifact server doesn't speak this action's wire protocol
      # (fails with "unknown field mime_type"); skip it under `just ci-local`.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !env.ACT }}
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  # Same-repo PRs publish :pr-<number> so a base/ change can be tried before
  # merge (CBOX_BASE_IMAGE=ghcr.io/the-mentor/cbox-base:pr-<n> just build).
  # Fork and Dependabot tokens can't write packages, so those only build.
  # Publishing from main happens in release.yml and the weekly schedule.
  base-image:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.base == 'true'
    permissions:
      contents: read
      packages: write
    concurrency:
      group: base-image-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: ./.github/workflows/base-image.yml
    with:
      tags: pr-${{ github.event.pull_request.number }}
      push: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}

  # Builds custom/ (amd64 only: its steps are architecture-independent) on the
  # PR's own base when one was published, else on :latest. Never pushed:
  # cbox-custom is built per person. always() lets it run when base-image was
  # skipped; the result checks stop it on a failed or cancelled base.
  #
  # GHCR creates a package private on its first push, so pulling a just-pushed
  # :pr-<n> anonymously would fail: log in whenever base-image published one
  # (same-repo, non-Dependabot PR, whose GITHUB_TOKEN can read the package).
  # Forks and Dependabot PRs never get here with an image, so they stay
  # anonymous and pull the public :latest.
  custom-image:
    needs: [changes, base-image]
    if: >-
      always() && github.event_name == 'pull_request' &&
      needs.changes.result == 'success' && needs.changes.outputs.custom == 'true' &&
      (needs.base-image.result == 'success' || needs.base-image.result == 'skipped')
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - if: needs.base-image.outputs.image != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: custom
          platforms: linux/amd64
          pull: true
          push: false
          build-args: BASE_IMAGE=${{ needs.base-image.outputs.image || 'ghcr.io/the-mentor/cbox-base:latest' }}

  # The single check the ruleset requires. Passes if every job passed or was
  # skipped for having nothing to check, so jobs and matrices can change
  # without a ruleset change. (A skipped matrix job never reports its per-row
  # check names.)
  ci-ok:
    name: CI
    if: always()
    needs: [changes, build, base-image, custom-image]
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          RESULTS: ${{ needs.build.result }} ${{ needs.base-image.result }} ${{ needs.custom-image.result }}
        run: |
          [ "$CHANGES" = success ] || { echo "changes: $CHANGES"; exit 1; }
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "a job ended $r"; exit 1 ;; esac
          done
