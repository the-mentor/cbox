name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Incremental artifacts are useless on a fresh runner and bloat the cache.
  CARGO_INCREMENTAL: 0

jobs:
  # Job and matrix names are load-bearing: the default-branch ruleset requires
  # "build (ubuntu-latest, cbox-linux-x86_64)" and "build (macos-14, cbox-macos-arm64)".
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: cbox-linux-x86_64
          - os: macos-14
            asset: cbox-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # boxlite's build.rs compiles boxlite-shared, which requires protoc >= 3.12
      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      # Hosted runners ship rustup; act's runner image doesn't, so install it there.
      - name: Update Rust toolchain
        run: |
          if ! command -v rustup >/dev/null; then
            curl -fsSL --proto '=https' --tlsv1.2 https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup update stable
          rustup default stable

      # Dependency compilation is ~3.5 min of an uncached run. Keyed on the
      # lockfile; restore-keys falls back to the last cache for this OS. PRs can
      # restore caches saved on main, so pushes to main keep them warm.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            cbox/target
          key: cargo-${{ runner.os }}-${{ hashFiles('cbox/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Unit Test
        working-directory: cbox
        run: cargo test --release

      - name: Build
        working-directory: cbox
        run: cargo build --release

      - run: cp cbox/target/release/cbox ${{ matrix.asset }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
