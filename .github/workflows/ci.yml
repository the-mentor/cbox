name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Job and matrix names are load-bearing: the default-branch ruleset requires
  # "build (ubuntu-latest, cbox-linux-x86_64)" and "build (macos-14, cbox-macos-arm64)".
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: cbox-linux-x86_64
          - os: macos-14
            asset: cbox-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # boxlite's build.rs compiles boxlite-shared, which requires protoc >= 3.12
      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      # Hosted runners ship rustup; act's runner image doesn't, so install it there.
      - name: Update Rust toolchain
        run: |
          if ! command -v rustup >/dev/null; then
            curl -fsSL --proto '=https' --tlsv1.2 https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup update stable
          rustup default stable

      - name: Unit Test
        working-directory: cbox
        run: cargo test --release

      - name: Build
        working-directory: cbox
        run: cargo build --release

      - run: cp cbox/target/release/cbox ${{ matrix.asset }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release-please:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Everything below runs as the release app: its PRs and merges trigger
      # workflows (GITHUB_TOKEN's don't), and it can bypass the ruleset to merge.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
      # One release for the whole repo: opens/updates a release PR that bumps
      # CHANGELOG.md and cbox's Cargo.toml/Cargo.lock; merging it tags vX.Y.Z and
      # publishes the GitHub release. Later artifacts (e.g. images) hang off the same tag.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
      # Only merge if the PR was opened by this app and only bumps versions and
      # prepends to the changelog. The merge is pinned to the commit checked.
      - if: steps.release.outputs.prs_created == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: steps.release.outputs.prs_created == 'true'
        run: |
          read -r author sha < <(gh pr view "$BRANCH" --json author,headRefOid -q '"\(.author.login) \(.headRefOid)"')
          if [ "$author" != "app/$APP_SLUG" ]; then
            echo "::error::release PR opened by $author, not app/$APP_SLUG; not merging"
            exit 1
          fi
          git fetch --no-tags origin "$sha"
          python3 .github/scripts/check_release_pr.py origin/main "$sha"
          gh pr merge "$BRANCH" --squash --admin --match-head-commit "$sha"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BRANCH: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}

  # Attaches this run's binaries to the release release-please just published.
  upload-assets:
    needs: [build, release-please]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - run: gh release upload "$TAG" dist/cbox-linux-x86_64 dist/cbox-macos-arm64 --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
